<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;width:420px;padding:12px;font:14px system-ui,Arial,sans-serif}
  textarea{width:100%;box-sizing:border-box;height:70px;font:13px ui-monospace,Consolas,monospace;padding:6px}
  button{margin:6px 0;padding:6px 14px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}
  #out{max-height:420px;overflow:auto}
</style></head>
<body>
  <b>🐧 Linux Command Explainer (AI)</b>
  <textarea id="in" placeholder="Paste a command, e.g. tail -f /var/log/auth.log | grep Failed"></textarea>
  <button id="go">Explain</button>
  <div id="out" class="card"></div>
  <script src="commands.js"></script>
  <script src="popup.js"></script>
</body></html>
