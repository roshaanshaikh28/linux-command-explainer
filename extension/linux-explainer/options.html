<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Linux Command Explainer settings</title>
  <style>
    body{
      max-width:560px;
      margin:40px auto;
      font:15px/1.5 system-ui,Arial,sans-serif;
      padding:0 16px
    }

    input{
      width:100%;
      box-sizing:border-box;
      padding:8px;
      margin:4px 0 14px;
      font:14px ui-monospace,Consolas,monospace
    }

    button{
      padding:8px 18px;
      border:0;
      border-radius:6px;
      background:#2563eb;
      color:#fff;
      cursor:pointer
    }

    .note{
      background:#e8f5e9;
      border-left:3px solid #16a34a;
      padding:8px 12px;
      font-size:13px;
      margin:16px 0
    }

    #msg{
      margin-left:10px;
      color:#15803d
    }
  </style>
</head>

<body>
  <h2>🐧 Linux Command Explainer: settings</h2>

  <label>Ollama model</label>
  <input
    id="model"
    placeholder="linux-soc-teacher:latest"
    autocomplete="off"
  >

  <button id="save">Save</button>
  <span id="msg"></span>

  <div class="note">
    <b>Privacy:</b> explanations are processed locally by Ollama on this computer.
    Your selected command is sent to the local Ollama API at
    <code>127.0.0.1:11434</code> and is not sent to Anthropic.
  </div>

  <script src="options.js"></script>
</body>
</html>
